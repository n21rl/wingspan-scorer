# fly.toml app configuration file generated for sparrows on 2026-07-27T16:04:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sparrows'
primary_region = 'ams'

[build]

[env]
  WINGSPAN_DB = '/data/wingspan.db'

[[mounts]]
  source = 'wingspan_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
